spring.application.name=EventManagement

### DATABASE ###
spring.datasource.url=jdbc:mysql://localhost:3306/EventManagement?createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

### JPA / HIBERNATE ###
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

### SERVER ###
server.port=8099

### WEBSOCKET ###
spring.websocket.max-text-message-size=8192
spring.websocket.max-binary-message-size=8192

### SPRINGDOC / OPENAPI ###
springdoc.show-websocket-endpoints=true
springdoc.cache.disabled=true
springdoc.show-actuator=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

### SPRING CLOUD ###
spring.cloud.config.enabled=false

### LOGGING ###
logging.level.com.example.eventmanagement=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
